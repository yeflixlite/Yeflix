name: Linux Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev mpv libfuse2 patchelf desktop-file-utils \
            libjavascriptcoregtk-4.0-18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      # linuxdeploy empaqueta libmpv y sus dependencias. El AppDir resultante
      # se reutiliza para el tarball, así el portable tampoco necesita libmpv
      # instalado en el sistema.
      - name: Build AppImage
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=AppDir

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp -r "$BUNDLE"/* "$APPDIR/usr/bin/"
          cp assets/icon/logo.png "$APPDIR/yeflix.png"
          cp assets/icon/logo.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/yeflix.png"
          cp packaging/linux/yeflix.desktop "$APPDIR/yeflix.desktop"
          cp packaging/linux/yeflix.desktop "$APPDIR/usr/share/applications/yeflix.desktop"

          export APPIMAGE_EXTRACT_AND_RUN=1

          MPV_LIB=$(ldconfig -p | awk '/libmpv\.so/ {print $NF; exit}')
          if [ -z "$MPV_LIB" ]; then
            echo "No se encontró libmpv en el sistema" >&2
            exit 1
          fi
          echo "libmpv: $MPV_LIB"

          # JavaScriptCore: lo usan las extensiones JavaScript (flutter_js).
          # Lo empaquetamos para que no haya que instalarlo en la distro.
          JSC_LIB=$(ldconfig -p | awk '/libjavascriptcoregtk-4\.0\.so\.18/ {print $NF; exit}')
          if [ -z "$JSC_LIB" ]; then
            echo "No se encontró libjavascriptcoregtk-4.0.so.18 en el sistema" >&2
            exit 1
          fi
          echo "javascriptcore: $JSC_LIB"

          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/yeflix" \
            --library "$MPV_LIB" \
            --library "$JSC_LIB" \
            --desktop-file "$APPDIR/yeflix.desktop" \
            --icon-file "$APPDIR/yeflix.png"

          # AppRun propio: garantiza que libapp.so y libmpv se encuentren.
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/yeflix" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q -O appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage "$APPDIR" "Yeflix-${VERSION}-Linux-x86_64.AppImage"
          ls -lh Yeflix-*.AppImage

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BUNDLE=build/linux/x64/release/bundle
          PKG="Yeflix-${VERSION}-Linux-x64"

          rm -rf "$PKG"
          mkdir -p "$PKG"
          cp -a "$BUNDLE"/. "$PKG"/
          # libmpv y dependencias ya empaquetadas por linuxdeploy.
          cp -a AppDir/usr/lib/. "$PKG/lib/"

          mv "$PKG/yeflix" "$PKG/yeflix.bin"
          cat > "$PKG/yeflix" <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/yeflix.bin" "$@"
          EOF
          chmod +x "$PKG/yeflix" "$PKG/yeflix.bin"
          cp assets/icon/logo.png "$PKG/yeflix.png"

          tar -czf "$PKG.tar.gz" "$PKG"
          echo "tarball=$PKG.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "$PKG.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yeflix-Linux
          path: |
            ${{ steps.package.outputs.tarball }}
            Yeflix-*-Linux-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.3"
          fi
          gh release upload "$TAG" \
            "${{ steps.package.outputs.tarball }}" \
            Yeflix-*-Linux-x86_64.AppImage \
            --clobber
